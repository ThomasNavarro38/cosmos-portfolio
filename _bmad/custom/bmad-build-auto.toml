# Story 4.9 (Thomas, ruling Q1 (a), 2026-10-20): deferred-work.md is the one deferral register.
# Epic 9 retro item 9 (Thomas, scope ruled 2026-11-27): off-story rulings, allowances and budgets need a spec and a memlog entry first.
# Epic 9 retro item 10 (Thomas, design ruled 2026-11-27): follow-up review flags hold the merge to main.
[workflow]
persistent_facts = [
  "Deferral register (Thomas, ruling Q1 (a), 2026-10-20): deferred-work.md is the one deferral register, so whenever a review defers a finding, besides the spec's deferred: frontmatter (only that spec's copy), also append it to _bmad-output/implementation-artifacts/deferred-work.md as a \"- source_spec / summary / evidence\" entry (plus location and severity when the review gives them) under a new section at the end of the file headed \"## Deferred from: code review of <spec-file>.md[, <round>] (<review date>)\".",
  "Rulings, allowances and budgets need a spec and a memlog entry first (Thomas, Epic 9 retro item 9, F-P2, scope ruled 2026-11-27): this binds any change whose ruling, allowance or budget effect is not already covered by an epic story's spec, including ad-hoc fixes, retro remediation items (spec-e*-r*) and review fix-ups after a story is done. It triggers on any one of: (a) a change to an AD ruling in _bmad-output/planning-artifacts/architecture/architecture-cosmos-portfolio-2026-09-01/ARCHITECTURE-SPINE.md; (b) a change to a named audit allowance, meaning AD-19's list in the spine or any allowlist in the audit tests that enforce it: src/render-scene/scene-model.test.ts (the effects scan, PREFERENCE_ROLES), scripts/bundle-assertion.test.ts (the chunk module lists) and src/render-scene/realism/done.test.ts (UNCHANGED, SINCE_M2); (c) a change to a ruled section or a token value in _bmad-output/planning-artifacts/ux-designs/ux-cosmos-portfolio-2026-09-01/DESIGN.md; (d) a budget change, meaning a changed limit in src/render-scene/realism/budgets.ts (AD-23), or a single change that grows a byte budget's chunk (realism or scene) by 20% or more of its remaining headroom, or grows it to leave less than 2,000 B free, measured with scripts/bundle-assertion.test.ts before and after the change (both chunks are already under 2,000 B free, so today any growth of either triggers (d)). No later than the change's own commit (abdbac2 carried both records in the same commit), it needs a spec in _bmad-output/implementation-artifacts/ and a dated RULING entry in each memlog whose trigger applies: the architecture .memlog.md (_bmad-output/planning-artifacts/architecture/architecture-cosmos-portfolio-2026-09-01/.memlog.md) for (a), (b) and (d), and the UX .memlog.md (_bmad-output/planning-artifacts/ux-designs/ux-cosmos-portfolio-2026-09-01/.memlog.md) for (c), so a change like d157b65 needs both, each giving the measured cost when there is one. abdbac2 is the model (spec-belt-soft-planet-junction.md and the 2026-11-22 RULING entry, architecture .memlog.md:124). An agent records Thomas's ruling and never makes one: if Thomas has not given the ruling, HALT with status blocked and name the ruling needed.",
  "Follow-up review flags hold the merge to main (Thomas, Epic 9 retro item 10, F-P1, F-P3, design ruled 2026-11-27): no merge into main and no push to main while any flag counts in the tree main would have after it (so the commit that records a review or a waiver may land). A flag counts when a .md file anywhere under _bmad-output/implementation-artifacts/ (subfolders included, not only the branch's own specs) has followup_review_recommended: true (any case) in its leading frontmatter and no followup_review_waived: value in the ruled form below; clear it by running the follow-up review it asks for, whose own run then sets the flag to false, as Epic 9 retro item 2 did for 17 flags. A waiver is the frontmatter field followup_review_waived: \"Thomas, <YYYY-MM-DD>, <reason>\", the flag stays true for history, and only Thomas grants it: an agent writes the field only when quoting Thomas's ruling. An epic whose last story is an on-screen judgement runs its epic-wide follow-up review before that judgement, not after. npm run check:followup (scripts/check-followup.ts) lists the counted files and exits 1 while any counts; it runs in ci.yml on pull requests into main and in deploy.yml before the build, not in npm test or npm run gate. If asked to merge or push to main while a flag counts, HALT with status blocked and name the flagged specs.",
]
